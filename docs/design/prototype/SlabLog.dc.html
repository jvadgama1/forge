<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slab: log a set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e6ff3a}a:hover{color:#f3ff9c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121212; color: #f2f2f2; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 18px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="font: 900 22px 'Big Shoulders Display', sans-serif; letter-spacing: 2px; color: #e6ff3a">FORGE</div>
    <button style="height: 36px; padding: 0 10px; border: 2px solid #333333; border-radius: 4px; background: none; color: #f2f2f2; font: 700 12px 'JetBrains Mono', monospace; letter-spacing: 1px">WORK GYM ▾</button>
  </div>

  <div style="padding: 14px 20px 12px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #2a2a2a">
    <h1 style="margin: 0; font: 900 64px/0.9 'Big Shoulders Display', sans-serif; text-transform: uppercase">Push A</h1>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 700 12px 'JetBrains Mono', monospace; color: #9a9a9a">
      <span style="color: #ff7a6e; font-size: 16px; font-variant-numeric: tabular-nums">32:14</span>
      <span>EX 02/05</span>
    </div>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
      <div style="font: 800 32px/1 'Big Shoulders Display', sans-serif; text-transform: uppercase">Incline DB Press</div>
      <div style="padding: 4px 8px; border-radius: 2px; background: #e6ff3a; color: #121212; font: 800 11px 'JetBrains Mono', monospace; letter-spacing: 1px">CHEST</div>
    </div>
    <div style="font-size: 12px; color: #9a9a9a">⌁ BENCH NOTCH 3 · NEUTRAL GRIP</div>

    <a href="#" style="display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 12px; border-left: 4px solid #ff7a6e; background: #1c1c1c; text-decoration: none; color: #f2f2f2">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 1px; color: #ff7a6e">LAST — OCT 14 — RIR 1</div>
        <div style="font: 800 24px/1 'Big Shoulders Display', sans-serif; font-variant-numeric: tabular-nums">60×10 / 60×9 / 60×8</div>
      </div>
      <div style="font: 700 12px 'JetBrains Mono', monospace; color: #e6ff3a">HISTORY →</div>
    </a>

    <div style="display: flex; flex-direction: column; font-size: 14px; font-variant-numeric: tabular-nums">
      <div style="display: grid; grid-template-columns: 36px 1fr 70px 24px; align-items: center; height: 34px; border-bottom: 1px solid #2a2a2a">
        <span style="color: #9a9a9a">01</span><span style="font-weight: 700">65 LB × 10</span><span style="color: #9a9a9a">RIR 2</span><span style="color: #e6ff3a; font-weight: 800">✓</span>
      </div>
      <div style="display: grid; grid-template-columns: 36px 1fr 70px 24px; align-items: center; height: 34px; border-bottom: 1px solid #2a2a2a">
        <span style="color: #9a9a9a">02</span><span style="font-weight: 700">65 LB × 9</span><span style="color: #9a9a9a">RIR 1</span><span style="color: #e6ff3a; font-weight: 800">✓</span>
      </div>
      <div style="display: grid; grid-template-columns: 36px 1fr 70px 24px; align-items: center; height: 34px">
        <span style="color: #e6ff3a; font-weight: 800">03</span><span style="color: #e6ff3a; font-weight: 800">NOW</span><span style="color: #9a9a9a">TGT 8–12</span><span style="color: #ff7a6e; font-weight: 800">▲</span>
      </div>
    </div>
  </div>

  <div style="margin: 6px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 2px solid #e6ff3a; border-radius: 4px">
    <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; border-right: 2px solid #2a2a2a">
      <div style="font: 900 88px/0.9 'Big Shoulders Display', sans-serif; font-variant-numeric: tabular-nums">65</div>
      <div style="font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 2px; color: #9a9a9a; margin-bottom: 8px">LB</div>
      <div style="display: flex; gap: 8px">
        <button aria-label="Decrease weight" style="width: 52px; height: 44px; border: 2px solid #333333; border-radius: 4px; background: #1c1c1c; color: #f2f2f2; font: 800 20px 'JetBrains Mono', monospace">−</button>
        <button aria-label="Increase weight" style="width: 52px; height: 44px; border: 2px solid #333333; border-radius: 4px; background: #1c1c1c; color: #f2f2f2; font: 800 20px 'JetBrains Mono', monospace">+</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px">
      <div style="font: 900 88px/0.9 'Big Shoulders Display', sans-serif; font-variant-numeric: tabular-nums">8</div>
      <div style="font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 2px; color: #9a9a9a; margin-bottom: 8px">REPS</div>
      <div style="display: flex; gap: 8px">
        <button aria-label="Decrease reps" style="width: 52px; height: 44px; border: 2px solid #333333; border-radius: 4px; background: #1c1c1c; color: #f2f2f2; font: 800 20px 'JetBrains Mono', monospace">−</button>
        <button aria-label="Increase reps" style="width: 52px; height: 44px; border: 2px solid #333333; border-radius: 4px; background: #1c1c1c; color: #f2f2f2; font: 800 20px 'JetBrains Mono', monospace">+</button>
      </div>
    </div>
  </div>

  <div style="margin: 10px 20px 0; display: grid; grid-template-columns: 56px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center">
    <span style="font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 1px; color: #9a9a9a">RIR</span>
    <button style="height: 38px; border: 2px solid #333333; border-radius: 4px; background: none; color: #f2f2f2; font: 700 14px 'JetBrains Mono', monospace">0</button>
    <button style="height: 38px; border: 2px solid #ff7a6e; border-radius: 4px; background: #ff7a6e; color: #121212; font: 800 14px 'JetBrains Mono', monospace">1</button>
    <button style="height: 38px; border: 2px solid #333333; border-radius: 4px; background: none; color: #f2f2f2; font: 700 14px 'JetBrains Mono', monospace">2</button>
    <button style="height: 38px; border: 2px solid #333333; border-radius: 4px; background: none; color: #f2f2f2; font: 700 14px 'JetBrains Mono', monospace">3</button>
    <button style="height: 38px; border: 2px solid #333333; border-radius: 4px; background: none; color: #f2f2f2; font: 700 14px 'JetBrains Mono', monospace">4+</button>
  </div>

  <button style="margin: 12px 20px 0; height: 58px; border: 0; border-radius: 4px; background: #e6ff3a; color: #121212; font: 900 26px 'Big Shoulders Display', sans-serif; letter-spacing: 2px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px">LOG SET 03 <span>→</span></button>

  <nav style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #2a2a2a; padding: 0 8px 18px">
    <button style="height: 52px; border: 0; border-top: 3px solid #e6ff3a; margin-top: -2px; background: none; color: #e6ff3a; font: 800 12px 'JetBrains Mono', monospace; letter-spacing: 1px">LOG</button>
    <button style="height: 52px; border: 0; background: none; color: #9a9a9a; font: 700 12px 'JetBrains Mono', monospace; letter-spacing: 1px">STATS</button>
    <button style="height: 52px; border: 0; background: none; color: #9a9a9a; font: 700 12px 'JetBrains Mono', monospace; letter-spacing: 1px">COACH</button>
    <button style="height: 52px; border: 0; background: none; color: #9a9a9a; font: 700 12px 'JetBrains Mono', monospace; letter-spacing: 1px">MORE</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }
