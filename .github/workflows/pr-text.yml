name: PR text

# Fails a pull request whose title, body or commits would close an issue its
# body says it is only part of (#153). A workflow of its own, so editing the
# body re-runs this check alone, not `check` and its emulators.
#
# The PR's text is untrusted: the script reads it from the event file and
# git, and no `${{ }}` expression puts it in a `run:` line. `pull_request`
# (never `pull_request_target`) gives a fork's PR a read-only token and no
# secrets.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-text:
    name: pr-text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit in the PR, for their messages.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tools/pr-text/run.js
